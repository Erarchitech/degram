# DeGram per-scope profile config (variant degram, plan 1301-10).
# Regenerated from this template every time a scope is opened: edits to the generated file are discarded.
# No secret and no relay address lives here; the delegated credential and the relay base arrive at runtime
# through the gateway RPC degram.credentials.set and stay in memory.
model:
  provider: custom
  default: degram-system
fallback_providers: []
providers: {}
toolsets: [clarify, todo, degram, mcp-revit]
platform_toolsets:
  cli: [clarify, todo, degram, mcp-revit]
  desktop: [clarify, todo, degram, mcp-revit]
  tui: [clarify, todo, degram, mcp-revit]
# The pinned read-only Revit bridge (plan 1301-11, D-11): an MCP stdio child started with the bundled Python.
# Electron main sets DEGRAM_PYTHON (bundled interpreter) and DEGRAM_REVIT_MCP_DIR (apps/revit-mcp) for the backend;
# an unset variable keeps the literal placeholder, the spawn fails and the Revit group reports setup-incomplete.
# DEGRAM_MODE=1 makes the adapter refuse HTTP/SSE (no MCP port is ever opened). Only the eight allowlisted read
# tools register; resources, prompts, sampling and elicitation are off. No retry: a slow read is BUSY after 40 s.
mcp_servers:
  revit:
    command: ${DEGRAM_PYTHON}
    args:
      - ${DEGRAM_REVIT_MCP_DIR}/main.py
    env:
      DEGRAM_MODE: "1"
    enabled: true
    connect_timeout: 20
    timeout: 40
    tools:
      include:
        - get_revit_status
        - get_revit_model_info
        - list_open_documents
        - get_selection_snapshot
        - get_element_properties
        - list_levels
        - get_current_view_info
        - list_category_parameters
      resources: false
      prompts: false
    sampling:
      enabled: false
    elicitation:
      enabled: false
# Every auxiliary uses the pinned relay route or is disabled (compression is the only one that runs).
auxiliary:
  compression:
    provider: auto
    model: ""
    base_url: ""
    api_key: ""
  title_generation:
    provider: auto
    model_upgrade_enabled: false
  background_review:
    enabled: false
tools:
  tool_search:
    enabled: "off"
model_catalog:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: false
nous:
  guest: false
curator:
  enabled: false
plugins:
  auto_update_check_hours: 0
  auto_apply: false
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
